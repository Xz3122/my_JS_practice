<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div style="font-size: 100px;color:brown;">Read Json</div>
    <button onclick = "getdata()"style="color: blue;">讀取Json檔</button>
    <div id="result"></div>
    <script>
        function getdata(){
            fetch('./data2.json').then(function(res){//AJAX fetch
                return res.json();
            }).then(function(data){
                console.log(data);//只會顯示在console端不會顯示在畫面上
                let result = document.querySelector("#result")//取得名為result的id
                result.innerHTML = '';//點擊1次先清空再呈現資料，innerHTML:將程式處理過後的結果呈現在網頁上
                for(let i=0;i<data.length;i++){
                   let book = data[i];
                   result.innerHTML+="<div>"+book.title+","+book.author+","+book.year+","+book.genre+","+book.read+","+book.rating.趣味+","+book.rating.恐怖+","+book.rating.溫馨+"</div>"
                }
            })
        }
    </script>
</body>
</html>
